[project]
name = "pagila-semantic-layer"
version = "0.1.0"
description = "Read-only semantic layer for the Pagila PostgreSQL database"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2", "pyyaml>=6", "sqlglot>=25"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: needs the pagila database (PAGILA_PG_USER and PAGILA_PG_PASSWORD)",
  "live: needs a live external service (LLM)",
]
