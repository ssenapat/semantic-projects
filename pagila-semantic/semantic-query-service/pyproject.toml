[project]
name = "semantic-query-service"
version = "0.1.0"
description = "HTTP API for the read-only Pagila semantic layer"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the pagila database (PAGILA_PG_USER / PAGILA_PG_PASSWORD)"]
