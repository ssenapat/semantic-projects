[project]
name = "streamlit-analytics-client"
version = "0.1.0"
description = "Streamlit interface for asking business questions about the Pagila database"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.50", "pandas>=2.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
