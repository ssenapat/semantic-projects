[project]
name = "llm-intent-parser-service"
version = "0.1.0"
description = "Turns business questions into semantic requests for the Pagila semantic layer"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "httpx>=0.27", "anthropic[bedrock]>=0.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Claude API and the query service (needs Bedrock access or ANTHROPIC_API_KEY, and PAGILA_PG_*)"]
