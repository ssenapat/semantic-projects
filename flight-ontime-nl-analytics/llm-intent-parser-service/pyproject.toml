[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-intent-parser-service"
version = "0.2.0"
description = "LLM Intent Parser Service (SP-2 C2): question + LLM-safe context -> one schema-valid outcome"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.2",
  "anthropic[bedrock]==2.3.0",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["llm_intent_parser_service*"]

[tool.setuptools.package-data]
llm_intent_parser_service = ["app/services/stub_responses.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
